services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: devops-cicd-service:local
    container_name: devops-cicd-app
    ports:
      - "5000:5000"
    environment:
      - ENVIRONMENT=production
      - APP_NAME=DevOps-CICD-Service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
